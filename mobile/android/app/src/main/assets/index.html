<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>J.A.R.V.I.S.</title><style>body{margin:0;background:#05070a;color:#e8f1ff;font-family:Arial,sans-serif;min-height:100vh}.app{max-width:720px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center}.brand{letter-spacing:4px;font-weight:700;font-size:24px}.mode{padding:10px;border:1px solid #28485d;border-radius:12px;background:#0b1118;color:#9fe4ff}.orb{width:160px;height:160px;border-radius:50%;border:2px solid #6bdcff;margin:120px auto 50px;box-shadow:0 0 35px #17445a;display:grid;place-items:center}.orb:after{content:'';width:70px;height:70px;border:2px solid #9fe4ff;border-radius:50%;box-shadow:0 0 25px #45cfff}.card{background:#0a0f15;border:1px solid #1d2c38;border-radius:18px;padding:14px}.msg{min-height:45px;color:#b8c9d6}.row{display:flex;gap:8px}input{flex:1;min-width:0;background:#05080c;color:white;border:1px solid #243746;border-radius:12px;padding:13px}button{border:1px solid #28485d;background:#0b1118;color:#9fe4ff;border-radius:12px;padding:12px}.small{margin-top:10px;font-size:12px;color:#70818d}</style></head><body><main class="app"><div class="top"><div><div class="brand">J.A.R.V.I.S.</div><div class="small">● PHONE MODE — ONLINE</div></div><button onclick="access()">⚙️ Доступ</button></div><div class="orb"></div><div class="card"><div id="msg" class="msg">Готов к управлению телефоном, сэр.</div><div class="row"><input id="cmd" placeholder="Что прикажете?"><button onclick="send()">➤</button></div></div></main><script>function send(){const e=document.getElementById('cmd'),t=e.value.trim();if(!t)return;let r=window.AndroidJarvis?AndroidJarvis.command(t):'Android bridge недоступен';document.getElementById('msg').textContent=r;e.value=''}function access(){if(window.AndroidJarvis)document.getElementById('msg').textContent=AndroidJarvis.enableAccessibility();else document.getElementById('msg').textContent='Android bridge недоступен'}document.getElementById('cmd').addEventListener('keydown',e=>{if(e.key==='Enter')send()})</script></body></html>
