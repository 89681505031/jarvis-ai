<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#05070a">
  <title>J.A.R.V.I.S. Mobile</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div><div class="brand">J.A.R.V.I.S.</div><div id="status" class="status">● ONLINE</div></div>
      <button id="modeButton" class="mode" type="button">📱 PHONE MODE</button>
    </header>
    <section id="orbButton" class="orb-wrap" aria-label="JARVIS status" role="button" tabindex="0"><div class="orb"><span></span></div></section>
    <section class="panel">
      <div id="message" class="message">Готов к работе, сэр.</div>
      <div class="input-row"><input id="command" autocomplete="off" placeholder="Что прикажете?"><button id="send" type="button">➤</button></div>
    </section>
    <section id="appsPanel" class="apps-panel" hidden>
      <div class="apps-title">📱 Разрешённые приложения</div>
      <div id="appsList" class="apps-list"></div>
      <button id="refreshApps" class="apps-action" type="button">Обновить список</button>
    </section>
    <section id="settingsPanel" class="apps-panel" hidden>
      <div class="apps-title">⚙️ Персонаж J.A.R.V.I.S.</div>
      <div id="personaList" class="apps-list"></div>
    </section>
    <nav class="bottom-nav">
      <button id="appsNav" type="button">⚡ Команды</button>
      <button id="modeNav" type="button">📱 Телефон</button>
      <button id="settingsNav" type="button">⚙️ Настройки</button>
    </nav>
  </main>
  <script src="app.js"></script>
</body>
</html>
